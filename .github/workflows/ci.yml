name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run on the same branch is noise: cancel it rather than pay for
# a test run against code that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The floor from package.json's `engines`, plus the LTS lines a user is
    # most likely to be on. Testing only the newest Node hides a break at the
    # version a contributor actually has.
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    # Pinned rather than `latest`: that label migrates to Ubuntu 26 on
    # 2026-10-19, and the image a test ran on is not something that should
    # change on its own. Moving it is a deliberate commit.
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to a commit, not a tag: a tag is a mutable ref its
      # owner can repoint, and this job would then run whatever they pushed.
      # The trailing comment names the release each commit came from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `ci`, not `install`: it fails on a lockfile that disagrees with
      # package.json instead of quietly resolving a different tree.
      - run: npm ci

      # First, and on its own: a key in a commit has to be rotated, and the
      # sooner this fails the fewer commits it has to be taken out of. The
      # pre-commit hook is the same check, but a hook only runs for whoever
      # installed it — this runs for everyone, including a clone that never did.
      - name: No credentials in the tree
        run: npm run check:secrets

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The bin is the product. A typecheck and a green test suite do not prove
      # `dist/cli.js` builds or runs; this does.
      - name: Build
        run: npm run build

      - name: Smoke-test the binary
        run: node dist/cli.js --version
